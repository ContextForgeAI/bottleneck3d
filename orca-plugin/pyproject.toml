[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bottleneck3d-orca"
version = "0.3.0"
description = "Bottleneck3D OrcaSlicer integration spike"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Bottleneck3D" }
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bottleneck3d_orca = ["web/index.html"]
